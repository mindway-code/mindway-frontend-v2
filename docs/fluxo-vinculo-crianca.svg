<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1330" viewBox="0 0 1280 1330" role="img" aria-labelledby="title description">
  <title id="title">Fluxo atual de acesso à criança por código no MindWay</title>
  <desc id="description">Diagrama de sequência em português. O responsável cadastra a criança; a API gera e persiste um código de acesso. O responsável pode compartilhar esse código fora do aplicativo. A API aceita associação pelo código e retorna acesso existente ou novo. A tela atual de perfil não oferece essa associação ao terapeuta.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1 1L8 5L1 9" fill="none" stroke="#29465c" stroke-width="1.6"/></marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1 1L8 5L1 9" fill="none" stroke="#007b77" stroke-width="1.6"/></marker>
    <style>
      svg { font-family: Montserrat, 'Segoe UI', Arial, sans-serif; background: #ffffff; }
      .title { fill: #17304a; font-size: 30px; font-weight: 650; }
      .subtitle { fill: #607180; font-size: 17px; }
      .lane-title { fill: #163650; font-size: 17px; font-weight: 600; }
      .lane-sub { fill: #617785; font-size: 13px; }
      .step { fill: #234156; font-size: 16px; font-weight: 500; }
      .step-small { fill: #536c7d; font-size: 14px; }
      .step-teal { fill: #007b77; font-size: 16px; font-weight: 600; }
      .section { fill: #006c70; font-size: 14px; font-weight: 700; letter-spacing: 1.5px; }
      .note-title { fill: #1d4255; font-size: 17px; font-weight: 650; }
      .note { fill: #486070; font-size: 15px; }
      .lifeline { stroke: #b3c4c7; stroke-width: 1.5; stroke-dasharray: 6 7; }
      .flow { stroke: #29465c; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .return { stroke: #758d96; stroke-width: 1.7; stroke-dasharray: 5 5; fill: none; marker-end: url(#arrow); }
      .available { stroke: #007b77; stroke-width: 2; stroke-dasharray: 9 6; fill: none; marker-end: url(#arrowTeal); }
      .guide { stroke: #d8e3e4; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1280" height="1330" fill="#ffffff"/>
  <rect x="0" y="0" width="1280" height="8" fill="#006c70"/>
  <text x="70" y="56" class="title">Vínculo da criança por código de acesso</text>
  <text x="70" y="86" class="subtitle">Sequência baseada na implementação atual do MindWay · interface Angular + API Node/Express + PostgreSQL</text>

  <rect x="44" y="118" width="204" height="76" rx="8" fill="#e9f5f3" stroke="#c4dfdb"/>
  <rect x="288" y="118" width="204" height="76" rx="8" fill="#f4f7f6" stroke="#dfe5e4"/>
  <rect x="532" y="118" width="204" height="76" rx="8" fill="#f4f7f6" stroke="#dfe5e4"/>
  <rect x="776" y="118" width="204" height="76" rx="8" fill="#f4f7f6" stroke="#dfe5e4"/>
  <rect x="1020" y="118" width="204" height="76" rx="8" fill="#e9f5f3" stroke="#c4dfdb"/>
  <text x="146" y="149" text-anchor="middle" class="lane-title">Responsável</text>
  <text x="146" y="174" text-anchor="middle" class="lane-sub">conta comum</text>
  <text x="390" y="149" text-anchor="middle" class="lane-title">Frontend</text>
  <text x="390" y="174" text-anchor="middle" class="lane-sub">Angular</text>
  <text x="634" y="149" text-anchor="middle" class="lane-title">API</text>
  <text x="634" y="174" text-anchor="middle" class="lane-sub">Node.js / Express</text>
  <text x="878" y="149" text-anchor="middle" class="lane-title">Banco de dados</text>
  <text x="878" y="174" text-anchor="middle" class="lane-sub">PostgreSQL / Prisma</text>
  <text x="1122" y="149" text-anchor="middle" class="lane-title">Terapeuta</text>
  <text x="1122" y="174" text-anchor="middle" class="lane-sub">conta profissional</text>

  <path class="lifeline" d="M146 194V1170 M390 194V1170 M634 194V1170 M878 194V1170 M1122 194V1170"/>

  <text x="70" y="229" class="section">A · CRIAÇÃO DA CRIANÇA E DO CÓDIGO</text>
  <path class="flow" d="M146 279H390"/>
  <text x="268" y="268" text-anchor="middle" class="step">1. Cadastra criança</text>

  <path class="flow" d="M390 349H634"/>
  <text x="512" y="337" text-anchor="middle" class="step">2. POST /children</text>

  <rect x="518" y="373" width="232" height="68" rx="8" fill="#e9f5f3" stroke="#c4dfdb"/>
  <text x="634" y="400" text-anchor="middle" class="step-small">Valida o responsável</text>
  <text x="634" y="422" text-anchor="middle" class="step-small">e gera código único</text>

  <path class="flow" d="M634 476H878"/>
  <text x="756" y="464" text-anchor="middle" class="step">3. Cria Child</text>
  <text x="756" y="493" text-anchor="middle" class="step-small">com accessCode</text>

  <path class="return" d="M878 535H634"/>
  <text x="756" y="524" text-anchor="middle" class="step-small">Confirma persistência</text>

  <path class="return" d="M634 592H390"/>
  <text x="512" y="580" text-anchor="middle" class="step-small">4. Retorna Child + código</text>

  <path class="return" d="M390 652H146"/>
  <text x="268" y="640" text-anchor="middle" class="step-small">5. Exibe código no perfil</text>

  <path class="flow" d="M146 714H1122"/>
  <rect x="410" y="684" width="445" height="26" fill="#ffffff"/>
  <text x="634" y="702" text-anchor="middle" class="step">6. Compartilha o código fora do aplicativo</text>

  <line x1="70" y1="754" x2="1210" y2="754" class="guide"/>
  <text x="70" y="786" class="section">B · ASSOCIAÇÃO DISPONÍVEL NA API</text>

  <path class="available" d="M1122 838H634"/>
  <rect x="760" y="808" width="240" height="24" fill="#ffffff"/>
  <text x="880" y="826" text-anchor="middle" class="step-teal">7. Envia accessCode</text>
  <text x="878" y="859" text-anchor="middle" class="step-small">POST /association-children · usuário autenticado</text>

  <path class="available" d="M634 906H878"/>
  <text x="756" y="895" text-anchor="middle" class="step-small">Busca Child pelo código</text>
  <path class="return" d="M878 952H634"/>
  <text x="756" y="942" text-anchor="middle" class="step-small">Retorna criança ou erro</text>

  <rect x="495" y="976" width="278" height="69" rx="8" fill="#e9f5f3" stroke="#c4dfdb"/>
  <text x="634" y="1003" text-anchor="middle" class="step-small">Verifica acesso já existente;</text>
  <text x="634" y="1027" text-anchor="middle" class="step-small">evita vínculo duplicado</text>

  <path class="available" d="M634 1084H878"/>
  <text x="756" y="1073" text-anchor="middle" class="step-small">Cria AssociationChild</text>
  <path class="return" d="M878 1125H634"/>
  <text x="756" y="1115" text-anchor="middle" class="step-small">Confirma vínculo</text>
  <path class="return" d="M634 1158H1122"/>
  <text x="878" y="1147" text-anchor="middle" class="step-small">Retorna acesso à criança</text>

  <rect x="70" y="1194" width="1154" height="94" rx="8" fill="#f4f7f6" stroke="#dfe5e4"/>
  <rect x="70" y="1194" width="5" height="94" fill="#006c70"/>
  <text x="96" y="1227" class="note-title">Estado da interface hoje</text>
  <text x="96" y="1254" class="note">A tela de perfil bloqueia a associação por código para terapeutas, profissionais e instituições.</text>
  <text x="96" y="1276" class="note">Assim, a etapa B existe na API, mas não é acionável por esses papéis nessa tela.</text>

  <text x="70" y="1310" class="lane-sub">Setas contínuas: fluxo da interface · Setas tracejadas em verde: capacidade da API · Setas cinzas: respostas</text>
</svg>
