<section class="card-ui--sm child-selector">

  <div class="child-selector-body">

    <!-- Seleção da criança -->
    <div class="select-ui select-ui--lg">

      <div class="select-ui__field">

        <select
          id="child-selector__select"
          class="select-ui__control"
          [ngModel]="selectedChildId || ''"
          (ngModelChange)="onSelect($event)"
          [disabled]="loading"
        >

          <option value="">
            Selecione uma criança
          </option>

          <option
            *ngFor="let child of children || []; trackBy: trackById"
            [value]="child.id"
          >
            {{ child.name }} - {{ child.age }} anos
          </option>

        </select>

        <label
          class="select-ui__label"
          for="child-selector__select"
        >
          Crianças cadastradas
        </label>

      </div>

      <!-- Quantidade de crianças -->
      <div class="child-selector__count">

        {{ children?.length || 0 }}

        criança<span
          *ngIf="(children?.length || 0) !== 1"
        >
          s
        </span>

        cadastrada<span
          *ngIf="(children?.length || 0) !== 1"
        >
          s
        </span>

      </div>

    </div>


    <!-- Carregando -->
    <p
      *ngIf="loading"
      class="child-selector__hint"
    >
      Carregando crianças...
    </p>


    <!-- Nenhuma criança cadastrada -->
    <p
      *ngIf="
        !loading &&
        (children?.length || 0) === 0
      "
      class="child-selector__hint"
    >
      Nenhuma criança cadastrada.
    </p>

  </div>

</section>
