<section class="dashborad-page" *ngIf="viewModel$ | async as vm; else dashboardLoading">
  <ng-container *ngIf="children$ | async as children">
    <app-admin-dashboard
      *ngIf="vm.role === 'admin'"
      [viewModel]="vm"
      [children]="children"
      [loading]="(childrenLoading$ | async) ?? false"
    ></app-admin-dashboard>

    <app-therapist-dashboard
      *ngIf="vm.role === 'therapist'"
      [viewModel]="vm"
      [children]="children"
      [loading]="(childrenLoading$ | async) ?? false"
    ></app-therapist-dashboard>

    <app-professional-dashboard
      *ngIf="vm.role === 'professional'"
      [viewModel]="vm"
      [children]="children"
      [loading]="(childrenLoading$ | async) ?? false"
    ></app-professional-dashboard>

    <app-institution-dashboard
      *ngIf="vm.role === 'enterprise'"
      [viewModel]="vm"
      [children]="children"
      [loading]="(childrenLoading$ | async) ?? false"
    ></app-institution-dashboard>

    <app-family-dashboard
      *ngIf="vm.role === 'common' || vm.role === 'default'"
      [viewModel]="vm"
      [children]="children"
      [loading]="(childrenLoading$ | async) ?? false"
    ></app-family-dashboard>
  </ng-container>
</section>

<ng-template #dashboardLoading>
  <app-page-skeleton variant="page" [rows]="4" label="Carregando painel"></app-page-skeleton>
</ng-template>
