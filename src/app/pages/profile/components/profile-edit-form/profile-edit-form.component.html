<section class="profile-edit">
  <header class="profile-edit__header">
    <div class="profile-edit__identity">
      <div class="profile-edit__photo">
        <img
          class="profile-edit__avatar"
          [src]="profilePhoto || 'assets/img/placeholder.PNG'"
          alt="Foto do perfil"
        />
        <button
          class="profile-edit__camera"
          type="button"
          aria-label="Adicionar ou alterar foto do perfil"
          (click)="profilePhotoInput.click()"
        >
          <i class="bi bi-camera-fill" aria-hidden="true"></i>
        </button>
        <input
          #profilePhotoInput
          class="profile-edit__file-input"
          type="file"
          accept="image/*"
          (change)="onProfilePhotoSelected($event)"
        />
      </div>
      <div>
        <h2 class="profile-edit__title">Informações pessoais</h2>
        <p class="profile-edit__subtitle">Esses dados identificam sua conta MindWay.</p>
      </div>
      <p *ngIf="photoError" class="profile-edit__photo-feedback is-error" role="alert">
        {{ photoError }}
      </p>
      <p *ngIf="photoMessage" class="profile-edit__photo-feedback" role="status">
        {{ photoMessage }}
      </p>
    </div>
  </header>

  <div *ngIf="error" class="profile-edit__error" role="alert">
    {{ error }}
  </div>

  <form class="profile-edit__form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="profile-edit__grid">
      <div class="input-ui">
        <div class="input-primary">
          <input
            class="input-ui__control"
            formControlName="name"
            type="text"
            placeholder="Nome completo"
            autocomplete="name"
          />
          <label class="input-ui__label">Nome completo</label>
        </div>

        <p
          class="profile-edit__hint"
          *ngIf="form.controls.name.touched && form.controls.name.invalid"
        >
          Informe seu nome com pelo menos 2 caracteres.
        </p>
      </div>

      <div class="input-ui">
        <div class="input-primary">
          <input
            class="input-ui__control"
            formControlName="email"
            type="email"
            placeholder="E-mail"
            autocomplete="email"
          />
          <label class="input-ui__label">E-mail</label>
        </div>

        <p
          class="profile-edit__hint"
          *ngIf="form.controls.email.touched && form.controls.email.invalid"
        >
          Informe um endereço de e-mail válido.
        </p>
      </div>
    </div>

    <footer class="profile-edit__actions">
      <button class="button-secondary" type="button" (click)="cancel.emit()" [disabled]="saving">
        Cancelar
      </button>

      <button class="button-primary" type="submit" [disabled]="saving">
        <ng-container *ngIf="!saving; else savingTpl">Salvar alterações</ng-container>
        <ng-template #savingTpl>Salvando...</ng-template>
      </button>
    </footer>
  </form>
</section>
