<section class="profile-page">
  <header class="profile-page__hero">
    <div class="profile-page__hero-content">
      <h1 class="profile-page__title">Meu perfil</h1>
      <p class="profile-page__subtitle">
        Gerencie suas informações pessoais e os perfis de seus filhos em um só lugar.
      </p>
    </div>

    <div class="profile-page__hero-actions" *ngIf="editMode">
      <button class="btn-ui btn-ui--light btn-ui--sm" type="button" (click)="cancelEdit()">
        Fechar
      </button>
    </div>
  </header>

  <div *ngIf="flashMessage" class="profile-page__flash" role="status">
    {{ flashMessage }}
  </div>

  <div
    *ngIf="userError$ | async as userError"
    class="profile-page__state profile-page__state--error"
    role="alert"
  >
    {{ userError }}
  </div>

  <div class="profile-page__grid">
    <ng-container *ngIf="user$ | async as user; else profileLoadingCards">
      <app-profile-summary-card
        *ngIf="!editMode"
        [user]="user"
        [childrenCount]="((children$ | async) ?? []).length"
        (edit)="startEdit()"
      ></app-profile-summary-card>

      <app-profile-edit-form
        *ngIf="editMode"
        [user]="user"
        [saving]="(profileSaving$ | async) ?? false"
        [error]="(profileError$ | async) ?? null"
        (save)="saveProfile($event)"
        (cancel)="cancelEdit()"
      ></app-profile-edit-form>
    </ng-container>

    <ng-template #profileLoadingCards>
      <app-page-skeleton
        class="profile-page__skeleton"
        variant="detail"
        [rows]="4"
        label="Carregando perfil"
      ></app-page-skeleton>
    </ng-template>
  </div>

  <app-children-section
    [children]="(children$ | async) ?? []"
    [loading]="(childrenLoading$ | async) ?? false"
    [saving]="(childrenSaving$ | async) ?? false"
    [error]="(childrenError$ | async) ?? null"
    [userRole]="(user$ | async)?.role ?? null"
    [associationLoading]="(associationLoading$ | async) ?? false"
    [associationError]="(associationError$ | async) ?? null"
    [showCreate]="showCreateChild"
    (toggleCreate)="toggleCreateChild()"
    (createChild)="createChild($event)"
    (closeCreate)="closeCreateChild()"
    (associateChild)="associateChild($event)"
  ></app-children-section>

  <section class="profile-page__invites card-ui card-ui--md">
    <header class="profile-page__invites-header">
      <div>
        <h2 class="profile-page__section-title">
          <i class="bi bi-people"></i>
          Compartilhar acesso
        </h2>
        <p class="profile-page__subtitle">
          Convide instituições e profissionais para acessar informações de forma segura e
          colaborativa.
        </p>
      </div>
    </header>

    <div class="profile-page__invite-grid">
      <article class="profile-page__invite-card" *ngFor="let invite of inviteLinks">
        <div class="profile-page__invite-icon" aria-hidden="true">
          <i class="bi" [ngClass]="invite.icon"></i>
        </div>

        <div class="profile-page__invite-copy">
          <h3>{{ invite.label }}</h3>
          <p>{{ invite.description }}</p>
        </div>

        <button
          class="btn-ui btn-ui--light btn-ui--sm"
          type="button"
          (click)="copyInviteLink(invite.path)"
        >
          Copiar código
        </button>
      </article>
    </div>
  </section>
</section>
