<section class="reports-empty-page">
  <span class="reports-empty-page__icon" aria-hidden="true">
    <i
      class="bi"
      [ngClass]="variant === 'no-children' ? 'bi-person-plus' : 'bi-file-earmark-plus'"
    ></i>
  </span>

  <ng-container *ngIf="variant === 'no-children'; else noReports">
    <h2>Nenhum perfil infantil disponível</h2>
    <p>Conecte uma criança para consultar ou criar relatórios de acompanhamento.</p>
    <a class="button-primary" routerLink="/child-profile">
      <i class="bi bi-person-plus" aria-hidden="true"></i>Conectar criança
    </a>
  </ng-container>

  <ng-template #noReports>
    <h2>Nenhum relatório disponível</h2>
    <p>O primeiro registro desta criança aparecerá aqui quando for criado ou compartilhado.</p>
    <button class="button-primary" type="button" (click)="create.emit()">
      <i class="bi bi-plus-lg" aria-hidden="true"></i>Criar relatório
    </button>
  </ng-template>
</section>
