<div class="report-form__backdrop" (click)="cancel.emit()">
  <section
    class="report-form"
    role="dialog"
    aria-modal="true"
    aria-labelledby="report-form-title"
    (click)="$event.stopPropagation()"
  >
    <header class="report-form__header">
      <div>
        <p>{{ mode === 'create' ? 'Novo registro' : 'Atualizar registro' }}</p>
        <h2 id="report-form-title">
          {{ mode === 'create' ? 'Criar relatório' : 'Editar relatório' }}
        </h2>
        <small>Organize somente as informações relevantes para o acompanhamento.</small>
      </div>
      <button
        type="button"
        [disabled]="saving"
        (click)="cancel.emit()"
        aria-label="Fechar formulário"
      >
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" class="report-form__body">
      <label class="report-form__field report-form__field--wide">
        <span>Título do relatório</span>
        <input type="text" formControlName="title" [disabled]="saving" autocomplete="off" />
        <small *ngIf="form.controls.title.touched && form.controls.title.invalid" role="alert">
          Informe um título para continuar.
        </small>
      </label>

      <label class="report-form__field">
        <span>Comportamento e observações</span>
        <textarea rows="6" formControlName="behavior" [disabled]="saving"></textarea>
        <small>Descreva fatos observados e o contexto.</small>
      </label>

      <label class="report-form__field">
        <span>Dificuldades identificadas</span>
        <textarea rows="6" formControlName="difficulty" [disabled]="saving"></textarea>
        <small>Registre situações que precisam de atenção.</small>
      </label>

      <label class="report-form__field report-form__field--wide">
        <span>Recomendações</span>
        <textarea rows="5" formControlName="recommendation" [disabled]="saving"></textarea>
        <small>Inclua orientações e próximos passos possíveis.</small>
      </label>

      <footer class="report-form__actions">
        <button class="button-secondary" type="button" [disabled]="saving" (click)="cancel.emit()">
          Cancelar
        </button>
        <button class="button-primary" type="submit" [disabled]="saving">
          <i class="bi" [ngClass]="saving ? 'bi-arrow-repeat' : 'bi-check2'" aria-hidden="true"></i>
          {{ saving ? 'Salvando...' : mode === 'create' ? 'Criar relatório' : 'Salvar alterações' }}
        </button>
      </footer>
    </form>
  </section>
</div>
