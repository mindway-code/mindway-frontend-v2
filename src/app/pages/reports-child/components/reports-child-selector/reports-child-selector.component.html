<section class="child-selector" aria-labelledby="child-selector-title">
  <div class="child-selector__label">
    <span class="child-selector__avatar" aria-hidden="true">
      <img
        *ngIf="selectedChild && getPhoto(selectedChild) as photo; else childInitial"
        [src]="photo"
        alt=""
      />
      <ng-template #childInitial>{{ selectedChild ? getInitial(selectedChild) : 'C' }}</ng-template>
    </span>
    <div>
      <span id="child-selector-title">Criança</span>
      <strong>{{ selectedChild?.name || 'Selecionar' }}</strong>
    </div>
  </div>

  <div class="child-selector__controls">
    <label class="child-selector__search">
      <i class="bi bi-search" aria-hidden="true"></i>
      <span class="visually-hidden">Pesquisar criança</span>
      <input
        type="search"
        autocomplete="off"
        placeholder="Buscar criança"
        [value]="searchTerm"
        (input)="updateSearch($event)"
      />
    </label>

    <label class="child-selector__select">
      <span class="visually-hidden">Selecionar criança</span>
      <select
        [disabled]="loading || !children.length"
        [value]="selectedChildId || ''"
        (change)="selectChild($event)"
      >
        <option value="" disabled>Selecione</option>
        <option *ngFor="let child of filteredChildren; trackBy: trackById" [value]="child.id">
          {{ child.name }} — {{ child.age }} anos
        </option>
      </select>
    </label>
  </div>
</section>
